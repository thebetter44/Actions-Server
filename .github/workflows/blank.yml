name: Paradise Minecraft
on:
  workflow_dispatch:
  schedule:
    # 4:00 AM UTC = 9:30 AM IST. Runs Sat, Sun, and Mon to cover the 45 hours.
    - cron: '0 * * * 6,0,1' 

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check IST Time Window
        run: |
          # 45 hours from Sat 9:30 AM IST ends on Monday 6:30 AM IST.
          HOUR_IST=$(date -d "+5 hours +30 minutes" +%H)
          DAY_IST=$(date -d "+5 hours +30 minutes" +%u)
          
          if [ "$DAY_IST" -eq 1 ] && [ "$HOUR_IST" -ge 7 ]; then
            echo "Paradise Minecraft weekend session ended. See you next week!"
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '25' # 26.1.x requires Java 25
          distribution: 'temurin'

      - name: Configure Latest Fabric & Cracked
        run: |
          # Version 26.1.1 is the current stable release
          echo "VERSION=26.1.1" >> $GITHUB_ENV
          echo "TYPE=FABRIC" >> $GITHUB_ENV
          
          # Force Cracked Mode (Offline Mode)
          if [ -f server.properties ]; then
            sed -i 's/online-mode=true/online-mode=false/g' server.properties
          else
            echo "online-mode=false" > server.properties
          fi

      - name: Run Server
        run: |
          chmod +x ./start.sh
          ./start.sh
        env:
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
          GITHUB_TOKEN: ${{ secrets.FINE_GRAINED_PAT }}
