name: Paradise Minecraft
on:
  workflow_dispatch:
  schedule:
    # 4:00 AM UTC = 9:30 AM IST Saturday
    - cron: '0 4 * * 6'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Weekend Window
        run: |
          # Ends session at Monday 6:30 AM IST (45 hours total)
          HOUR_IST=$(date -d "+5 hours +30 minutes" +%H)
          DAY_IST=$(date -d "+5 hours +30 minutes" +%u)
          if [ "$DAY_IST" -eq 1 ] && [ "$HOUR_IST" -ge 7 ]; then
            echo "Weekend window closed. Goodbye!"
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Configure Server
        run: |
          echo "VERSION=26.1.2" >> $GITHUB_ENV
          echo "TYPE=FABRIC" >> $GITHUB_ENV
          # Force Cracked Mode
          [ -f server.properties ] && sed -i 's/online-mode=true/online-mode=false/g' server.properties || echo "online-mode=false" > server.properties

      - name: Run Paradise Minecraft
        run: |
          chmod +x ./start.sh
          # Run server and capture PID
          ./start.sh &
          SERVER_PID=$!
          
          # GitHub Actions timeout is 6 hours (21600s). 
          # We stop at 5h 45m (20700s) to save the world safely.
          sleep 20700
          kill $SERVER_PID
          echo "Saving world and restarting session..."
          
          # Trigger auto-restart
          curl -X POST -H "Authorization: token ${{ secrets.FINE_GRAINED_PAT }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://github.com{{ github.repository }}/actions/workflows/blank.yml/dispatches \
          -d '{"ref":"main"}'
        env:
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
          GITHUB_TOKEN: ${{ secrets.FINE_GRAINED_PAT }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
